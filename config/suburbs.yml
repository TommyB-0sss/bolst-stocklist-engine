# config/suburbs.yml
# ---
# Source of truth for region routing. Two pieces:
#   1. The 10 canonical Bolst regions (one of which is the "One Part
#      Contracts" tab, used when row.is_one_part=True regardless of suburb).
#   2. The Victorian-suburb-to-region map covering every suburb seen in
#      the live builder data.
#
# Suburbs not in this map land on the "Uncategorised" tab during render.
# Tom maps them during morning review and they get added here permanently.
#
# Lookup is performed by lib/routing.py with case-insensitive matching and
# pre-normalisation that handles known source defects (see comment block on
# `suburb_aliases` below). Parsers DO NOT modify suburb strings — raw is
# preserved on each StocklistRow; normalisation happens only at the routing
# layer, keeping concerns separate.
#
# Last full audit: 2026-05-25 against 526 builder rows + 121 REA listings.
# REA audit added 21 new mappings (mostly Gippsland + Goulburn Valley) and
# the missing "Warrnambool" self-mapping. Two borderline calls: Bunyip ->
# gippsland (matches Drouin's eastward grouping); Kilmore -> metro-north
# (matches Wallan's commuter-belt ruling).

regions:
  - id: one-part-contracts
    name: One Part Contracts
    # Special-case region: assigned when StocklistRow.is_one_part=True,
    # regardless of suburb. Bypasses suburb_to_region lookup.
  - id: geelong-colac
    name: Geelong & Colac
  - id: gippsland
    name: Gippsland
  - id: horsham
    name: Horsham
  - id: metro-north
    name: Metro North
  - id: metro-south-east
    name: Metro South East
  - id: metro-west
    name: Metro West
  - id: regional-north-east
    name: Regional North East
  - id: regional-west
    name: Regional West
  - id: warrnambool
    name: Warrnambool
  # Added 2026-09-16 (Inam): Tom's Ignite export now carries South Australian
  # and Tasmanian listings (Angle Vale SA; Gagebrook, George Town, Latrobe,
  # Lawitta, New Norfolk, Westbury TAS). One catch-all region so they render
  # and count on the cover; split into per-state regions when Tom asks.
  # No banner artwork exists for it, so the render falls back to a brand-green
  # title band (lib/pdf_render._draw_banner). Cover line is the 11th entry in
  # lib/pdf_render.COVER_REGION_COUNTS with a code-drawn label.
  - id: interstate
    name: Interstate

# Banner image filename per region, used by Stage 8 (PDF render).
# `interstate` deliberately has no entry — see the note above.
# Confirmed 2026-05-08 by visually inspecting each Green-NN.jpg — every
# banner has the region name rendered in cursive script on the right side,
# unambiguous mapping.
region_banner:
  one-part-contracts:    "Header for stocklist Green_One Part Cont.jpg"
  geelong-colac:         "Header for stocklist Green-01.jpg"
  gippsland:             "Header for stocklist Green-02.jpg"
  regional-west:         "Header for stocklist Green-03.jpg"
  regional-north-east:   "Header for stocklist Green-04.jpg"
  warrnambool:           "Header for stocklist Green-05.jpg"
  horsham:               "Header for stocklist Green-06.jpg"
  metro-north:           "Header for stocklist Green-07.jpg"
  metro-south-east:      "Header for stocklist Green-08.jpg"
  metro-west:            "Header for stocklist Green-09.jpg"

# Pre-normalisation rules applied by lib/routing.py BEFORE alias lookup,
# in this order:
#   1. Strip trailing parens block:  "Bonshaw (Ballarat)" → "Bonshaw"
#   2. Strip trailing state/country tail (added 2026-08-06):
#        "Winter Valley VIC, Australia" → "Winter Valley"
#      Must precede rule 3, which would otherwise leave "Australia".
#   3. If contains comma, take last part:
#        "Penndale Street, Tarneit" → "Tarneit"
#   4. Trim whitespace, uppercase
#   5. Apply suburb_aliases below
#   6. Look up in suburb_to_region (case-insensitive, uppercased keys)
#
# These rules are documented here, not in suburbs.yml itself, because
# they're code-level. Updating them is a code change, not a config change.

# Spelling variations producers use that need to collapse to a canonical
# key. Keys and values are matched case-insensitively after uppercasing.
suburb_aliases:
  "Frasers Rise": "Fraser Rise"   # Luxton possessive form
  "Mt Duneed":    "Mount Duneed"  # Aplace abbreviation
  "Wrragul":      "Warragul"      # added 2026-06-16 — Aplace misspelling of Warragul
  "Mickelham":    "Mickleham"     # added 2026-08-06 — Aplace misspelling (missing the 'l')
  "Wagandary":    "Wangandary"    # added 2026-08-06 — Specialised's spelling, in both its section
                                  # headers and its data rows; the locality is Wangandary
  # Also handled by pre-normalisation rules (no alias needed):
  #   "Penndale Street, Tarneit" → comma split → "Tarneit"
  #   "Tarnala Road, Tarneit"    → comma split → "Tarneit"
  #   "Bonshaw (Ballarat)"       → parens strip → "Bonshaw"

